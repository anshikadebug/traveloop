<app-navbar></app-navbar>

<div
  class="details-container"
  *ngIf="trip"
>

  <img
    [src]="trip.image_url"
    class="hero-image"
  />

  <div class="content">

    <h1>
      {{ trip.trip_name }}
    </h1>

    <p class="description">

      {{ trip.description }}

    </p>

    <div class="dates">

      <p>
        📅 Start:
        {{ trip.start_date }}
      </p>

      <p>
        📅 End:
        {{ trip.end_date }}
      </p>

    </div>

  </div>

</div>
