<div class="create-trip-container">

  <h1>Create New Trip ✈️</h1>

  <input
    type="text"
    placeholder="Trip Name"
    [(ngModel)]="trip_name"
  >

  <textarea
    placeholder="Trip Description"
    [(ngModel)]="description"
  ></textarea>

  <input
    type="date"
    [(ngModel)]="start_date"
  >

  <input
    type="date"
    [(ngModel)]="end_date"
  >

  <button (click)="createTrip()">
    Create Trip
  </button>
<input
  type="text"
  placeholder="Image URL"
  [(ngModel)]="image_url"
/>
</div>
