<app-navbar></app-navbar>

<div class="page">
  <h1>Trip Notes 📝</h1>

  <textarea placeholder="Write your note..." [(ngModel)]="note"></textarea>

  <button (click)="addNote()">Save Note</button>

  @for (note of notes; track $index) {
    <div class="note-card">
      <p>{{ note }}</p>
      <button (click)="deleteNote($index)">Delete</button>
    </div>
  }
</div>
